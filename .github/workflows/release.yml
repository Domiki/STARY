name: Release

# Builds the installers for macOS (Apple silicon) and Windows. Pushing a tag such as v0.1.0 also makes a
# draft pre-release on GitHub with the installers and their SHA-256 checksums; it is published by hand.
# Run by hand (Actions → Release → Run workflow) it only builds, and keeps the installers as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust toolchain (the version of rust-toolchain.toml)
        run: rustup toolchain install

      - uses: swatinem/rust-cache@v2

      - name: Install the packages
        run: |
          npm install
          npm --prefix ui install

      - name: Build the installers
        run: npx tauri build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir installers
          cp target/release/bundle/dmg/*.dmg installers/ 2>/dev/null || true
          cp target/release/bundle/nsis/*.exe installers/ 2>/dev/null || true
          cp target/release/bundle/msi/*.msi installers/ 2>/dev/null || true
          ls -la installers

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: installers/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version of the program
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in tauri.conf.json"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/RELEASE_NOTES.md
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat installers/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" installers/* \
            --draft --prerelease \
            --title "STARY ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes-file notes.md
