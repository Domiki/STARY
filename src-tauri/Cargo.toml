[package]
name = "stary-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "stary_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
mimalloc = "0.1.52"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stary-color = { version = "0.1.0", path = "../crates/stary-color" }
stary-core = { version = "0.1.0", path = "../crates/stary-core" }
stary-io = { version = "0.1.0", path = "../crates/stary-io" }
stary-mask = { version = "0.1.0", path = "../crates/stary-mask" }
stary-pipeline = { version = "0.1.0", path = "../crates/stary-pipeline" }
stary-raw = { version = "0.1.0", path = "../crates/stary-raw" }
stary-register = { version = "0.1.0", path = "../crates/stary-register" }
stary-sky = { version = "0.1.0", path = "../crates/stary-sky" }
stary-stack = { version = "0.1.0", path = "../crates/stary-stack" }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"

[lints]
workspace = true
